version: 2

models:
  - name: fct_orders
    description: Order-level analytics fact table.

    columns:
      - name: event_id
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null

      - name: quantity
        tests:
          - not_null

      - name: order_value
        tests:
          - not_null