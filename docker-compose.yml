x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:?AIRFLOW_DB_USER is required}:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}@airflow-db:5432/${AIRFLOW_DB_NAME:?AIRFLOW_DB_NAME is required}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json.generated

    # Airflow 3 task processes must reach the API server over the Docker network.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

    # Shared by Scheduler and API Server for internal JWT signing
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET is required}"

    # Simple Auth Manager (Airflow 3 default) for local development.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin

    # RetailPulse warehouse connection used by the loader/tasks.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

    # Pipeline monitoring SLOs.
    MAX_LAG_ROWS: "${MAX_LAG_ROWS:-60}"
    MAX_LOAD_AGE_MINUTES: "${MAX_LOAD_AGE_MINUTES:-2880}"

    # Email configuration for alerts
    MAILTRAP_HOST: ${MAILTRAP_HOST:-}
    MAILTRAP_PORT: ${MAILTRAP_PORT:-}
    MAILTRAP_USERNAME: ${MAILTRAP_USERNAME:-}
    MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD:-}
    ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
    ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/auth:/opt/airflow/auth
    - ./warehouse:/opt/retailpulse/warehouse
    - ./data_lake:/opt/retailpulse/data_lake

  depends_on:
    airflow-db:
      condition: service_healthy
    postgres:
      condition: service_healthy


services:

  postgres:
    image: postgres:17
    container_name: retailpulse-postgres

    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  kafka-init:
    image: alpine:3.20
    container_name: retailpulse-kafka-init
    user: "0:0"

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /tmp/kraft-combined-logs
        chown -R 1000:1000 /tmp/kraft-combined-logs

    restart: "no"


  kafka:
    image: apache/kafka:4.1.0
    container_name: retailpulse-kafka

    ports:
      - "9092:9092"

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    depends_on:
      kafka-init:
        condition: service_completed_successfully
    
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: retailpulse-kafka-ui

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: retailpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy


  spark-master:
    image: apache/spark:4.1.3-python3
    container_name: retailpulse-spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    ports:
      - "7077:7077"
      - "8081:8080"

    volumes:
      - ./spark:/opt/retailpulse/spark
      - ./data_lake:/opt/retailpulse/data_lake
  
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  spark-worker:
    image: apache/spark:4.1.3-python3
    container_name: retailpulse-spark-worker

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./spark:/opt/retailpulse/spark
      - ./data_lake:/opt/retailpulse/data_lake


  airflow-db:
    image: postgres:17
    container_name: retailpulse-airflow-db

    environment:
      POSTGRES_USER: "${AIRFLOW_DB_USER:?AIRFLOW_DB_USER is required}"
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}"
      POSTGRES_DB: "${AIRFLOW_DB_NAME:?AIRFLOW_DB_NAME is required}"

    volumes:
      - airflow_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  airflow-init:
    <<: *airflow-common
    container_name: retailpulse-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
    restart: "no"


  airflow-api-server:
    <<: *airflow-common
    container_name: retailpulse-airflow-api-server
    command: api-server

    ports:
      - "8083:8080"

    restart: on-failure

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  airflow-scheduler:
    <<: *airflow-common
    container_name: retailpulse-airflow-scheduler
    command: scheduler

    depends_on:
      airflow-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      airflow-api-server:
        condition: service_healthy

    restart: on-failure


  airflow-dag-processor:
    <<: *airflow-common
    container_name: retailpulse-airflow-dag-processor
    command: dag-processor

    depends_on:
      airflow-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      airflow-api-server:
        condition: service_healthy

    restart: on-failure


volumes:
  postgres_data:
  airflow_db_data:
  kafka_data:
